<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contacto | El Camarón de Oro</title>

  <link rel="stylesheet" href="assets/styles.css">

  <style>
    /* =========================================================
       PÁGINA DE CONTACTO
       ========================================================= */

    .contact-page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      padding: 20px 0 75px;

      background:
        radial-gradient(circle at 8% 10%, rgba(201, 154, 91, 0.14), transparent 25%),
        radial-gradient(circle at 92% 80%, rgba(232, 201, 154, 0.17), transparent 28%),
        var(--cream);
    }

    .contact-page::before,
    .contact-page::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .contact-page::before {
      width: 300px;
      height: 300px;
      top: 50px;
      right: -150px;
      border: 1px solid rgba(201, 154, 91, 0.20);
    }

    .contact-page::after {
      width: 210px;
      height: 210px;
      bottom: 80px;
      left: -105px;
      border: 1px solid rgba(201, 154, 91, 0.16);
    }

    .contact-container {
      position: relative;
      z-index: 1;

      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* =========================================================
       ENCABEZADO
       ========================================================= */

    .contact-heading {
      max-width: 780px;
      margin: 0 auto 45px;
      text-align: center;
    }

    .contact-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 12px;

      color: var(--gold-dark);

      font-family: var(--sans);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .contact-eyebrow::before,
    .contact-eyebrow::after {
      content: "";

      width: 34px;
      height: 1px;

      background: var(--gold);
    }

    .contact-heading h2 {
      margin: 0;

      color: var(--ink);

      font-family: var(--serif);
      font-size: clamp(2.3rem, 5vw, 3.7rem);
      font-weight: 700;
      line-height: 1.05;
    }

    .contact-heading h2::after {
      content: "";

      display: block;

      width: 70px;
      height: 3px;

      margin: 18px auto 20px;

      border-radius: 10px;

      background: linear-gradient(
        90deg,
        var(--gold-dark),
        var(--gold-light),
        var(--gold-dark)
      );
    }

    .contact-heading p {
      max-width: 650px;
      margin: 0 auto;

      color: rgba(33, 26, 20, 0.68);

      font-family: var(--sans);
      font-size: 1rem;
      line-height: 1.75;
    }

    /* =========================================================
       CONTENIDO PRINCIPAL
       ========================================================= */

    .contact-content {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      gap: 28px;
      align-items: stretch;
    }

    /* =========================================================
       TARJETA DE INFORMACIÓN
       ========================================================= */

    .contact-card {
      position: relative;
      overflow: hidden;

      border: 1px solid rgba(201, 154, 91, 0.28);
      border-radius: 22px;

      background: rgba(255, 250, 242, 0.95);

      box-shadow:
        0 15px 40px rgba(33, 26, 20, 0.08),
        0 3px 10px rgba(33, 26, 20, 0.04);
    }

    .contact-card::before {
      content: "";

      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      height: 4px;

      background: linear-gradient(
        90deg,
        var(--gold-dark),
        var(--gold-light),
        var(--gold-dark)
      );
    }

    .contact-card-body {
      padding: 34px;
    }

    /* =========================================================
       MARCA / LOGO
       ========================================================= */

    .contact-brand {
      display: flex;
      align-items: center;
      gap: 18px;

      margin-bottom: 28px;
    }

    .contact-logo {
      flex: 0 0 auto;

      width: 82px;
      height: 82px;

      padding: 8px;

      border: 1px solid rgba(201, 154, 91, 0.35);
      border-radius: 50%;

      background: var(--paper);

      object-fit: contain;
    }

    .contact-brand-name {
      margin: 0;

      color: var(--ink);

      font-family: var(--serif);
      font-size: 1.65rem;
      font-weight: 700;
      line-height: 1.15;
    }

    .contact-brand-subtitle {
      margin-top: 6px;

      color: var(--gold-dark);

      font-family: var(--sans);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* =========================================================
       DATOS
       ========================================================= */

    .contact-details {
      display: grid;
      gap: 17px;

      margin-bottom: 28px;
    }

    .contact-detail {
      display: flex;
      align-items: flex-start;
      gap: 13px;
    }

    .contact-icon {
      display: flex;
      align-items: center;
      justify-content: center;

      flex: 0 0 auto;

      width: 38px;
      height: 38px;

      border: 1px solid rgba(201, 154, 91, 0.30);
      border-radius: 50%;

      background: rgba(201, 154, 91, 0.09);

      color: var(--gold-dark);

      font-size: 0.95rem;
    }

    .contact-detail-text {
      min-width: 0;
    }

    .contact-detail-label {
      margin-bottom: 3px;

      color: var(--gold-dark);

      font-family: var(--sans);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .contact-detail-value {
      color: rgba(33, 26, 20, 0.76);

      font-family: var(--sans);
      font-size: 0.93rem;
      line-height: 1.55;

      overflow-wrap: anywhere;
    }

    /* =========================================================
       BOTONES
       ========================================================= */

    .contact-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;

      padding-top: 24px;

      border-top: 1px solid rgba(201, 154, 91, 0.20);
    }

    .contact-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      min-height: 42px;

      padding: 10px 16px;

      border: 1px solid rgba(201, 154, 91, 0.40);
      border-radius: 999px;

      background: transparent;
      color: var(--ink);

      font-family: var(--sans);
      font-size: 0.78rem;
      font-weight: 800;

      text-decoration: none;

      transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        transform 0.25s ease;
    }

    .contact-action:hover {
      transform: translateY(-2px);

      border-color: var(--gold-dark);

      background: var(--gold-dark);
      color: #fffaf2;
    }

    /* =========================================================
       WHATSAPP
       ========================================================= */

    .contact-whatsapp {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      gap: 7px;

      min-height: 42px;
      padding: 10px 16px;

      border: 1px solid var(--gold-dark) !important;
      border-radius: 999px;

      background: var(--gold-dark) !important;
      color: #fffaf2 !important;

      font-family: var(--sans);
      font-size: 0.78rem;
      font-weight: 800;

      text-decoration: none;

      opacity: 1 !important;
      visibility: visible !important;

      transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        transform 0.25s ease;
    }

    .contact-whatsapp:hover {
      transform: translateY(-2px);

      background: var(--ink) !important;
      border-color: var(--ink) !important;
      color: #fffaf2 !important;
    }

    /* =========================================================
       MAPA
       ========================================================= */

    .contact-map-card {
      position: relative;
      overflow: hidden;

      min-height: 500px;

      border: 1px solid rgba(201, 154, 91, 0.28);
      border-radius: 22px;

      background: var(--ink);

      box-shadow:
        0 15px 40px rgba(33, 26, 20, 0.10),
        0 3px 10px rgba(33, 26, 20, 0.05);
    }

    .map-title {
      position: absolute;

      top: 18px;
      left: 18px;

      z-index: 3;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 9px 14px;

      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;

      background: rgba(33, 26, 20, 0.78);
      color: #fffaf2;

      backdrop-filter: blur(8px);

      font-family: var(--sans);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }

    .map-title::before {
      content: "⌖";

      color: var(--gold-light);

      font-size: 1rem;
    }

    .map-wrapper {
      width: 100%;
      height: 100%;
      min-height: 500px;
    }

    .map-wrapper iframe {
      display: block;

      width: 100%;
      height: 100%;
      min-height: 500px;

      border: 0;
    }

    /* =========================================================
       ERROR
       ========================================================= */

    .contact-error {
      padding: 30px;

      border: 1px dashed rgba(201, 154, 91, 0.45);
      border-radius: 18px;

      color: rgba(33, 26, 20, 0.65);

      text-align: center;

      font-family: var(--sans);
    }

    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 900px) {

      .contact-container {
        padding: 0 20px;
      }

      .contact-content {
        grid-template-columns: 1fr;
      }

      .contact-map-card {
        min-height: 430px;
      }

      .map-wrapper,
      .map-wrapper iframe {
        min-height: 430px;
      }
    }

    /* =========================================================
       CELULARES
       ========================================================= */

    @media (max-width: 700px) {

      .contact-page {
        padding: 10px 0 55px;
      }

      .contact-container {
        padding: 0 16px;
      }

      .contact-heading {
        margin-bottom: 32px;
      }

      .contact-eyebrow {
        gap: 8px;

        font-size: 0.66rem;
        letter-spacing: 0.16em;
      }

      .contact-eyebrow::before,
      .contact-eyebrow::after {
        width: 22px;
      }

      .contact-heading h2 {
        font-size: clamp(2rem, 10vw, 2.7rem);
      }

      .contact-heading p {
        font-size: 0.9rem;
        line-height: 1.65;
      }

      .contact-content {
        gap: 20px;
      }

      .contact-card {
        border-radius: 18px;
      }

      .contact-card-body {
        padding: 25px 20px;
      }

      .contact-brand {
        gap: 14px;
        margin-bottom: 24px;
      }

      .contact-logo {
        width: 68px;
        height: 68px;
      }

      .contact-brand-name {
        font-size: 1.35rem;
      }

      .contact-detail {
        gap: 10px;
      }

      .contact-icon {
        width: 35px;
        height: 35px;
      }

      .contact-actions {
        gap: 8px;
      }

      .contact-action,
      .contact-whatsapp {
        flex: 1 1 auto;
      }

      .contact-map-card {
        min-height: 360px;

        border-radius: 18px;
      }

      .map-wrapper,
      .map-wrapper iframe {
        min-height: 360px;
      }
    }

    /* =========================================================
       CELULARES PEQUEÑOS
       ========================================================= */

    @media (max-width: 420px) {

      .contact-container {
        padding: 0 13px;
      }

      .contact-card-body {
        padding: 22px 17px;
      }

      .contact-brand {
        align-items: flex-start;
      }

      .contact-logo {
        width: 60px;
        height: 60px;
      }

      .contact-brand-name {
        font-size: 1.22rem;
      }

      .contact-detail-value {
        font-size: 0.88rem;
      }

      .contact-action,
      .contact-whatsapp {
        width: 100%;
        flex-basis: 100%;
      }

      .contact-map-card {
        min-height: 320px;
      }

      .map-wrapper,
      .map-wrapper iframe {
        min-height: 320px;
      }

      .map-title {
        top: 12px;
        left: 12px;

        font-size: 0.65rem;
      }
    }
  </style>
</head>

<body>

  <header class="header"></header>

  <main class="contact-page">

    <div class="contact-container">

      <!-- ENCABEZADO -->
      <section class="contact-heading">

        <div class="contact-eyebrow">
          El Camarón de Oro
        </div>

        <h2>
          Contáctanos
        </h2>

        <p>
          Estamos listos para atenderte. Encuentra nuestros datos de contacto,
          horarios y ubicación para visitarnos o comunicarte con nosotros.
        </p>

      </section>

      <!-- CONTENIDO -->
      <div class="contact-content">

        <!-- INFORMACIÓN DE CONTACTO -->
        <section class="contact-card">

          <div
            class="contact-card-body"
            id="contactInfo"
          >
            <!-- La información se carga dinámicamente desde contacto.js -->
          </div>

        </section>

        <!-- UBICACIÓN -->
        <section
          class="contact-map-card"
          id="ubicacionSection"
          style="display: none;"
        >

          <div class="map-title">
            Nuestra ubicación
          </div>

          <div
            id="mapContainer"
            class="map-wrapper"
          >
            <!-- El mapa se insertará dinámicamente desde contacto.js -->
          </div>

        </section>

      </div>

    </div>

  </main>

  <footer class="footer"></footer>

  <script
    type="module"
    src="assets/contacto.js"
  ></script>

</body>

</html>
