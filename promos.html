<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Promociones | El Camarón de Oro</title>

  <link rel="stylesheet" href="assets/styles.css">

  <style>
    /* =========================================
       PROMOCIONES
       El Camarón de Oro
       Diseño premium
       ========================================= */

    .promos-page {
      position: relative;
      min-height: calc(100vh - 140px);
      overflow: hidden;
      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(201, 154, 91, 0.10),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 20%,
          rgba(201, 154, 91, 0.08),
          transparent 30%
        ),
        var(--cream);
    }

    /* Decoración ambiental */

    .promos-page::before {
      content: "";
      position: absolute;
      top: 90px;
      left: -120px;
      width: 300px;
      height: 300px;
      border: 1px solid rgba(201, 154, 91, 0.12);
      border-radius: 50%;
      pointer-events: none;
    }

    .promos-page::after {
      content: "";
      position: absolute;
      right: -140px;
      bottom: 80px;
      width: 330px;
      height: 330px;
      border: 1px solid rgba(201, 154, 91, 0.10);
      border-radius: 50%;
      pointer-events: none;
    }

    .promos-page .section {
      position: relative;
      z-index: 1;
      padding-top: 58px;
      padding-bottom: 80px;
    }

    /* =========================================
       ENCABEZADO
       ========================================= */

    .promos-heading {
      position: relative;
      text-align: center;
      margin: 0 auto 52px;
      max-width: 760px;
    }

    .promos-heading .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 13px;

      color: var(--gold-dark);
      font-family: var(--sans);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .promos-heading .eyebrow::before,
    .promos-heading .eyebrow::after {
      content: "";
      width: 32px;
      height: 1px;
      background: var(--gold);
      opacity: 0.7;
    }

    .promos-heading h2 {
      margin: 0;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(2.25rem, 5vw, 3.5rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .promos-heading h2::after {
      content: "";
      display: block;
      width: 72px;
      height: 2px;
      margin: 19px auto 17px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
      );
    }

    .promos-heading p {
      max-width: 560px;
      margin: 0 auto;
      color: rgba(33, 26, 20, 0.68);
      font-family: var(--sans);
      font-size: 0.95rem;
      line-height: 1.7;
    }

    /* =========================================
       GRID
       ========================================= */

    #promoGrid {
      position: relative;
      align-items: stretch;
      gap: 28px;
    }

    /* =========================================
       TARJETA
       ========================================= */

    #promoGrid .card {
      position: relative;
      overflow: hidden;

      display: flex;
      flex-direction: column;
      height: 100%;

      background: var(--paper);
      border: 1px solid rgba(201, 154, 91, 0.25);
      border-radius: 20px;

      box-shadow:
        0 10px 30px rgba(33, 26, 20, 0.07),
        0 2px 7px rgba(33, 26, 20, 0.04);

      transition:
        transform 0.4s cubic-bezier(0.22, 0.61, 0.36, 1),
        box-shadow 0.4s ease,
        border-color 0.4s ease;
    }

    #promoGrid .card:hover {
      transform: translateY(-9px);
      border-color: rgba(201, 154, 91, 0.55);

      box-shadow:
        0 22px 45px rgba(33, 26, 20, 0.13),
        0 5px 14px rgba(33, 26, 20, 0.07);
    }

    /* =========================================
       IMAGEN
       ========================================= */

    #promoGrid .card-image {
      position: relative;
      overflow: hidden;
      background: #e9dfd1;
    }

    #promoGrid .card img {
      display: block;
      width: 100%;
      height: 250px;

      object-fit: cover;

      transition:
        transform 0.7s cubic-bezier(0.22, 0.61, 0.36, 1),
        filter 0.5s ease;
    }

    #promoGrid .card:hover img {
      transform: scale(1.07);
      filter: saturate(1.05);
    }

    /* Oscurecimiento inferior de la imagen */

    #promoGrid .card-image::after {
      content: "";
      position: absolute;
      inset: 0;

      background: linear-gradient(
        to bottom,
        rgba(33, 26, 20, 0.02) 35%,
        rgba(33, 26, 20, 0.42) 100%
      );

      pointer-events: none;
    }

    /* =========================================
       ETIQUETA PROMOCIÓN
       ========================================= */

    #promoGrid .promo-label {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 3;

      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 7px 12px;

      color: #fff;
      background: rgba(33, 26, 20, 0.82);

      border: 1px solid rgba(232, 201, 154, 0.65);
      border-radius: 999px;

      font-family: var(--sans);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.10em;
      text-transform: uppercase;

      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    #promoGrid .promo-label::before {
      content: "✦";
      color: var(--gold-light);
      font-size: 0.75rem;
    }

    /* =========================================
       CONTENIDO
       ========================================= */

    #promoGrid .card .body {
      position: relative;

      display: flex;
      flex: 1;
      flex-direction: column;

      padding: 24px 23px 22px;
    }

    #promoGrid .card .body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 23px;

      width: 45px;
      height: 2px;

      background: var(--gold);
    }

    #promoGrid .card .title {
      margin: 0 0 12px;

      color: var(--ink);
      font-family: var(--serif);
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.25;
    }

    /* =========================================
       SEPARADOR
       ========================================= */

    #promoGrid .promo-divider {
      width: 100%;
      height: 1px;
      margin: 1px 0 17px;

      background:
        linear-gradient(
          90deg,
          rgba(201, 154, 91, 0.38),
          rgba(201, 154, 91, 0.08),
          transparent
        );
    }

    /* =========================================
       PRECIO
       ========================================= */

    #promoGrid .price-label {
      margin-bottom: 2px;

      color: rgba(33, 26, 20, 0.52);
      font-family: var(--sans);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #promoGrid .card .price {
      margin: 0;

      color: var(--gold-dark);
      font-family: var(--sans);
      font-size: 1.65rem;
      font-weight: 800;
      line-height: 1.2;
    }

    /* =========================================
       VIGENCIA
       ========================================= */

    #promoGrid .card .badge {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 7px;

      margin-top: 17px;
      padding: 7px 11px;

      color: var(--gold-dark);
      background: rgba(201, 154, 91, 0.09);

      border: 1px solid rgba(201, 154, 91, 0.23);
      border-radius: 8px;

      font-family: var(--sans);
      font-size: 0.76rem;
      font-weight: 600;
    }

    #promoGrid .card .badge::before {
      content: "◷";
      font-size: 0.9rem;
      color: var(--gold);
    }

    /* =========================================
       BRILLO AL PASAR EL MOUSE
       ========================================= */

    #promoGrid .card::before {
      content: "";
      position: absolute;

      top: 0;
      left: -120%;

      width: 70%;
      height: 100%;

      z-index: 5;
      pointer-events: none;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.16),
        transparent
      );

      transform: skewX(-18deg);
      transition: left 0.8s ease;
    }

    #promoGrid .card:hover::before {
      left: 150%;
    }

    /* =========================================
       SIN PROMOCIONES
       ========================================= */

    #promoGrid > .muted {
      grid-column: 1 / -1;

      padding: 55px 25px;

      text-align: center;

      color: var(--gold-dark);
      background: rgba(255, 250, 242, 0.6);

      border: 1px dashed rgba(201, 154, 91, 0.35);
      border-radius: 16px;

      font-family: var(--sans);
    }

    /* =========================================
       TABLET
       ========================================= */

    @media (max-width: 900px) {

      .promos-page .section {
        padding-top: 45px;
        padding-bottom: 65px;
      }

      #promoGrid {
        gap: 22px;
      }

      #promoGrid .card img {
        height: 220px;
      }

      #promoGrid .card .title {
        font-size: 1.3rem;
      }
    }

    /* =========================================
       CELULAR
       ========================================= */

    @media (max-width: 700px) {

      .promos-page .section {
        padding-top: 36px;
        padding-bottom: 52px;
      }

      .promos-heading {
        margin-bottom: 34px;
      }

      .promos-heading .eyebrow {
        font-size: 0.68rem;
        letter-spacing: 0.16em;
      }

      .promos-heading .eyebrow::before,
      .promos-heading .eyebrow::after {
        width: 22px;
      }

      .promos-heading h2 {
        font-size: clamp(2rem, 10vw, 2.7rem);
      }

      .promos-heading h2::after {
        margin-top: 15px;
        margin-bottom: 14px;
      }

      .promos-heading p {
        padding: 0 12px;
        font-size: 0.88rem;
      }

      #promoGrid {
        gap: 20px;
      }

      #promoGrid .card {
        border-radius: 17px;
      }

      #promoGrid .card img {
        height: 215px;
      }

      #promoGrid .card .body {
        padding: 21px 19px 19px;
      }

      #promoGrid .card .body::before {
        left: 19px;
      }

      #promoGrid .card .title {
        font-size: 1.28rem;
      }

      #promoGrid .card .price {
        font-size: 1.5rem;
      }

      #promoGrid .promo-label {
        top: 13px;
        left: 13px;
        padding: 6px 10px;
        font-size: 0.62rem;
      }
    }

    /* =========================================
       CELULAR PEQUEÑO
       ========================================= */

    @media (max-width: 420px) {

      .promos-heading {
        margin-bottom: 29px;
      }

      .promos-heading .eyebrow {
        gap: 8px;
      }

      .promos-heading h2 {
        font-size: 2rem;
      }

      #promoGrid .card img {
        height: 200px;
      }

      #promoGrid .card .body {
        padding: 19px 17px 18px;
      }

      #promoGrid .card .body::before {
        left: 17px;
      }
    }
  </style>
</head>

<body>

  <header class="header"></header>

  <main class="promos-page">

    <div class="container">

      <section class="section">

        <div class="promos-heading">

          <span class="eyebrow">
            El Camarón de Oro
          </span>

          <h2>
            Promociones vigentes
          </h2>

          <p>
            Descubre nuestras promociones especiales y disfruta
            de los sabores de El Camarón de Oro.
          </p>

        </div>

        <div id="promoGrid" class="grid cols-3"></div>

      </section>

    </div>

  </main>

  <footer class="footer"></footer>

  <script type="module" src="assets/promos.js"></script>

</body>
</html>
