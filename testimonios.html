<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Testimonios | El Camarón de Oro</title>

  <link rel="stylesheet" href="assets/styles.css">

  <style>
    /* =========================================
       TESTIMONIOS
       El Camarón de Oro
       Diseño premium
       ========================================= */

    .testimonials-page {
      position: relative;
      min-height: calc(100vh - 140px);
      overflow: hidden;

      background:
        radial-gradient(
          circle at 8% 12%,
          rgba(201, 154, 91, 0.10),
          transparent 28%
        ),
        radial-gradient(
          circle at 92% 75%,
          rgba(201, 154, 91, 0.08),
          transparent 30%
        ),
        var(--cream);
    }

    /* =========================================
       DECORACIONES DE FONDO
       ========================================= */

    .testimonials-page::before {
      content: "";

      position: absolute;
      top: 110px;
      left: -160px;

      width: 360px;
      height: 360px;

      border: 1px solid rgba(201, 154, 91, 0.12);
      border-radius: 50%;

      pointer-events: none;
    }

    .testimonials-page::after {
      content: "";

      position: absolute;
      right: -170px;
      bottom: 80px;

      width: 390px;
      height: 390px;

      border: 1px solid rgba(201, 154, 91, 0.10);
      border-radius: 50%;

      pointer-events: none;
    }

    .testimonials-page .section {
      position: relative;
      z-index: 1;

      padding-top: 58px;
      padding-bottom: 85px;
    }

    /* =========================================
       ENCABEZADO
       ========================================= */

    .testimonials-heading {
      max-width: 800px;
      margin: 0 auto 52px;

      text-align: center;
    }

    .testimonials-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 13px;

      color: var(--gold-dark);

      font-family: var(--sans);
      font-size: 0.75rem;
      font-weight: 800;

      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .testimonials-eyebrow::before,
    .testimonials-eyebrow::after {
      content: "";

      width: 32px;
      height: 1px;

      background: var(--gold);
      opacity: 0.7;
    }

    .testimonials-heading h2 {
      margin: 0;

      color: var(--ink);

      font-family: var(--serif);
      font-size: clamp(2.25rem, 5vw, 3.5rem);
      font-weight: 700;

      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .testimonials-heading h2::after {
      content: "";

      display: block;

      width: 72px;
      height: 2px;

      margin: 19px auto 17px;

      background: linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
      );
    }

    .testimonials-heading p {
      max-width: 600px;

      margin: 0 auto;

      color: rgba(33, 26, 20, 0.67);

      font-family: var(--sans);
      font-size: 0.96rem;
      line-height: 1.75;
    }

    /* =========================================
       GRID
       ========================================= */

    #testiGrid {
      position: relative;
      z-index: 2;

      align-items: stretch;

      gap: 28px;
    }

    /* =========================================
       TARJETA
       ========================================= */

    #testiGrid .testimonial-card {
      position: relative;

      display: flex;
      flex-direction: column;

      height: 100%;
      min-height: 275px;

      overflow: hidden;

      background: var(--paper);

      border: 1px solid rgba(201, 154, 91, 0.24);
      border-radius: 20px;

      box-shadow:
        0 10px 28px rgba(33, 26, 20, 0.07),
        0 2px 7px rgba(33, 26, 20, 0.04);

      transition:
        transform 0.4s cubic-bezier(0.22, 0.61, 0.36, 1),
        box-shadow 0.4s ease,
        border-color 0.4s ease;
    }

    #testiGrid .testimonial-card:hover {
      transform: translateY(-8px);

      border-color: rgba(201, 154, 91, 0.52);

      box-shadow:
        0 22px 42px rgba(33, 26, 20, 0.13),
        0 5px 12px rgba(33, 26, 20, 0.06);
    }

    /* =========================================
       COMILLAS DECORATIVAS
       ========================================= */

    #testiGrid .quote-mark {
      position: absolute;

      top: 8px;
      right: 21px;

      color: rgba(201, 154, 91, 0.15);

      font-family: Georgia, serif;
      font-size: 6rem;
      font-weight: 700;

      line-height: 1;

      pointer-events: none;
      user-select: none;
    }

    /* =========================================
       CONTENIDO
       ========================================= */

    #testiGrid .testimonial-body {
      position: relative;

      display: flex;
      flex: 1;

      flex-direction: column;

      padding: 28px 28px 25px;
    }

    #testiGrid .testimonial-body::before {
      content: "";

      position: absolute;

      top: 0;
      left: 28px;

      width: 48px;
      height: 2px;

      background: var(--gold);
    }

    /* =========================================
       ESTRELLAS
       ========================================= */

    #testiGrid .testimonial-rating {
      display: flex;
      align-items: center;
      gap: 2px;

      margin-bottom: 20px;

      color: var(--gold);

      font-size: 1.08rem;
      letter-spacing: 0.04em;
    }

    #testiGrid .rating-number {
      margin-left: 8px;

      color: rgba(33, 26, 20, 0.48);

      font-family: var(--sans);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0;
    }

    /* =========================================
       OPINIÓN
       ========================================= */

    #testiGrid .testimonial-opinion {
      flex: 1;

      margin-bottom: 25px;

      color: rgba(33, 26, 20, 0.75);

      font-family: var(--serif);
      font-size: 1.08rem;
      font-style: italic;

      line-height: 1.75;
    }

    #testiGrid .testimonial-opinion::before {
      content: "“";
      color: var(--gold-dark);

      font-family: Georgia, serif;
      font-size: 1.5rem;
      font-style: normal;
    }

    #testiGrid .testimonial-opinion::after {
      content: "”";
      color: var(--gold-dark);

      font-family: Georgia, serif;
      font-size: 1.5rem;
      font-style: normal;
    }

    /* =========================================
       DIVISOR
       ========================================= */

    #testiGrid .testimonial-divider {
      width: 100%;
      height: 1px;

      margin-bottom: 17px;

      background:
        linear-gradient(
          90deg,
          rgba(201, 154, 91, 0.35),
          rgba(201, 154, 91, 0.08),
          transparent
        );
    }

    /* =========================================
       NOMBRE
       ========================================= */

    #testiGrid .testimonial-name {
      display: flex;
      align-items: center;
      gap: 9px;

      color: var(--ink);

      font-family: var(--sans);
      font-size: 0.82rem;
      font-weight: 800;

      letter-spacing: 0.04em;
    }

    #testiGrid .testimonial-name::before {
      content: "";

      width: 8px;
      height: 8px;

      flex-shrink: 0;

      background: var(--gold);

      border-radius: 50%;

      box-shadow: 0 0 0 4px rgba(201, 154, 91, 0.12);
    }

    /* =========================================
       BRILLO
       ========================================= */

    #testiGrid .testimonial-card::before {
      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 70%;
      height: 100%;

      z-index: 5;

      pointer-events: none;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.15),
        transparent
      );

      transform: skewX(-18deg);

      transition: left 0.8s ease;
    }

    #testiGrid .testimonial-card:hover::before {
      left: 150%;
    }

    /* =========================================
       SIN TESTIMONIOS
       ========================================= */

    #testiGrid > .muted {
      grid-column: 1 / -1;

      padding: 55px 25px;

      text-align: center;

      color: var(--gold-dark);

      background: rgba(255, 250, 242, 0.65);

      border: 1px dashed rgba(201, 154, 91, 0.35);
      border-radius: 16px;

      font-family: var(--sans);
    }

    /* =========================================
       TABLET
       ========================================= */

    @media (max-width: 900px) {

      .testimonials-page .section {
        padding-top: 45px;
        padding-bottom: 70px;
      }

      .testimonials-heading {
        margin-bottom: 42px;
      }

      #testiGrid {
        gap: 22px;
      }

      #testiGrid .testimonial-body {
        padding: 24px 22px 22px;
      }

      #testiGrid .testimonial-body::before {
        left: 22px;
      }

      #testiGrid .testimonial-opinion {
        font-size: 1rem;
      }
    }

    /* =========================================
       CELULAR
       ========================================= */

    @media (max-width: 700px) {

      .testimonials-page .section {
        padding-top: 36px;
        padding-bottom: 55px;
      }

      .testimonials-heading {
        margin-bottom: 35px;
      }

      .testimonials-eyebrow {
        gap: 8px;

        font-size: 0.68rem;
        letter-spacing: 0.16em;
      }

      .testimonials-eyebrow::before,
      .testimonials-eyebrow::after {
        width: 22px;
      }

      .testimonials-heading h2 {
        font-size: clamp(2.05rem, 10vw, 2.7rem);
      }

      .testimonials-heading p {
        padding: 0 10px;

        font-size: 0.88rem;
      }

      /*
        Una sola opinión por fila en móvil.
      */

      #testiGrid {
        grid-template-columns: 1fr;

        gap: 20px;
      }

      #testiGrid .testimonial-card {
        min-height: 0;

        border-radius: 17px;
      }

      #testiGrid .testimonial-body {
        padding: 23px 19px 20px;
      }

      #testiGrid .testimonial-body::before {
        left: 19px;
      }

      #testiGrid .quote-mark {
        top: 5px;
        right: 16px;

        font-size: 5rem;
      }

      #testiGrid .testimonial-rating {
        margin-bottom: 17px;

        font-size: 1rem;
      }

      #testiGrid .testimonial-opinion {
        margin-bottom: 21px;

        font-size: 0.98rem;
        line-height: 1.72;
      }

      #testiGrid .testimonial-name {
        font-size: 0.78rem;
      }
    }

    /* =========================================
       CELULAR PEQUEÑO
       ========================================= */

    @media (max-width: 420px) {

      .testimonials-heading h2 {
        font-size: 2rem;
      }

      #testiGrid {
        gap: 18px;
      }

      #testiGrid .testimonial-body {
        padding: 21px 17px 19px;
      }

      #testiGrid .testimonial-body::before {
        left: 17px;
      }

      #testiGrid .testimonial-opinion {
        font-size: 0.94rem;
      }
    }
  </style>
</head>

<body>

  <header class="header"></header>

  <main class="testimonials-page">

    <div class="container">

      <section class="section">

        <div class="testimonials-heading">

          <span class="testimonials-eyebrow">
            El Camarón de Oro
          </span>

          <h2>
            Lo que dicen nuestros clientes
          </h2>

          <p>
            Cada visita deja una experiencia. Conoce las opiniones
            de quienes han disfrutado de nuestra atención y nuestros sabores.
          </p>

        </div>

        <div class="grid cols-2" id="testiGrid"></div>

      </section>

    </div>

  </main>

  <footer class="footer"></footer>

  <script type="module" src="assets/testimonios.js"></script>

</body>
</html>
